server.port=8085
spring.application.name=inventory-backend

# Database Configuration (Local H2 Database, ready for Supabase PostgreSQL)
spring.datasource.url=jdbc:h2:mem:chinodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS & Application configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Supabase configuration placeholders (can be updated via UI or env variables)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
